name: Validate

"on":
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.workflow == 'Deploy Production' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Install validation tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny,cargo-nextest@0.9.114,cargo-machete@0.8.0,wasm-bindgen-cli@0.2.127
      - name: Install operational self-test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binaryen libasound2-dev libudev-dev libwayland-dev sqlite3
          wasm-opt --version
          node --version
          google-chrome --version
          microsoft-edge --version
          command -v curl
          command -v openssl
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo machete --with-metadata
      - run: cargo deny check
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/test-wasm-source-hash.py
      - run: ./scripts/test-wasm-bundle-integrity.sh
      - run: ./scripts/test-wasm-bundle-lock.py
      - run: python3 scripts/test-browser-smoke-ready.py
        env:
          PWMTF_TEST_ARTIFACT_DIR: ${{ runner.temp }}/wasm-concurrency
      - run: ./scripts/test-wasm-bundle-concurrency.sh
        env:
          PWMTF_TEST_ARTIFACT_DIR: ${{ runner.temp }}/wasm-concurrency
      - name: Upload WASM concurrency diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-concurrency
          if-no-files-found: ignore
          retention-days: 7
      - run: ./scripts/test-wasm-bundle-server.sh
      - run: ./scripts/test-wasm-reproducible-build.sh
      - run: ./scripts/test-wasm-size-evidence.sh
      - run: ./scripts/test-feasibility-tools.sh
      - run: ./scripts/test-feasibility-matrix-lock.sh
      - run: ./scripts/test-feasibility-server.sh
      - run: ./scripts/test-browser-telemetry.js
      - run: ./scripts/test-production-smoke-self.sh
      - run: python3 scripts/test-provision-production-secrets.py
      - run: ./scripts/test-production-operations.sh
      - run: ./scripts/test-local-development-login.sh
      - run: ./scripts/test-backup-restore.sh
      - run: ./scripts/test-native-deployment-smoke.sh
      - run: ./scripts/check-architecture.sh
      - run: ./scripts/test-architecture-checks.sh

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Evaluate development shell
        run: nix flake check --no-build
