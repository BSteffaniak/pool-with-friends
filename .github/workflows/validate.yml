name: Validate

"on":
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
      - name: Install validation tools
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60
        with:
          tool: cargo-deny,cargo-nextest@0.9.114,cargo-machete@0.8.0,wasm-bindgen-cli@0.2.127
      - name: Install feasibility server tools
        run: command -v curl && command -v openssl
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --no-fail-fast
      - run: cargo machete --with-metadata
      - run: cargo deny check
      - run: ./scripts/build-wasm.sh
      - run: ./scripts/test-wasm-bundle-integrity.sh
      - run: ./scripts/test-wasm-bundle-server.sh
      - run: ./scripts/test-wasm-reproducible-build.sh
      - run: ./scripts/test-wasm-size-evidence.sh
      - run: ./scripts/test-feasibility-tools.sh
      - run: ./scripts/test-feasibility-server.sh
      - run: ./scripts/test-browser-telemetry.js
      - run: ./scripts/check-architecture.sh
      - run: ./scripts/test-architecture-checks.sh

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - uses: DeterminateSystems/nix-installer-action@90bb610b3b8a6e298f0e3f78de85b753d65e5259 # v19
      - name: Evaluate development shell
        run: nix flake check --no-build
