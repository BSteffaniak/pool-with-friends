[workspace]
members = [
    "packages/client",
    "packages/game_domain",
    "packages/protocol",
    "packages/server",
]
resolver = "3"

[workspace.package]
authors    = ["Braden Steffaniak"]
edition    = "2024"
license    = "MPL-2.0"
readme     = "README.md"
repository = "https://github.com/BSteffaniak/pool-with-friends"
version    = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = [
    "http1",
    "json",
    "query",
    "tokio",
    "ws",
] }
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "ui",
    "web",
    "webgl2",
] }
futures-lite = { version = "2.6.1", default-features = false, features = [
    "std",
] }
getrandom = { version = "0.4.3", default-features = false }
js-sys = { version = "0.3.104", default-features = false }
openidconnect = { version = "4.0.1", default-features = false, features = [
    "reqwest",
    "rustls-tls",
] }
serde = { version = "1.0.229", default-features = false, features = [
    "derive",
    "std",
] }
sha2 = { version = "0.11.0", default-features = false }
switchy_database = { version = "0.4.0", default-features = false, features = [
    "schema",
    "simulator",
] }
switchy_database_connection = { version = "0.4.0", default-features = false, features = [
    "turso",
] }
switchy_schema = { version = "0.4.0", default-features = false, features = [
    "code",
] }
thiserror = { version = "2.0.20", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6.11", default-features = false, features = [
    "fs",
    "set-header",
] }
wasm-bindgen = { version = "0.2.127", default-features = false }
web-sys = { version = "0.3.104", default-features = false, features = [
    "Location",
    "Window",
] }

[profile.release]
codegen-units = 1
lto           = false
opt-level     = 3
strip         = "symbols"

[profile.release-lto]
inherits = "release"
lto      = "fat"

[profile.release-lto-no-panic]
inherits = "release-lto"
panic    = "abort"

[profile.small]
inherits  = "release-lto-no-panic"
opt-level = "z"
