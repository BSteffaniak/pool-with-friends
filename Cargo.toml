[workspace]
members = [
    "packages/client",
    "packages/game_domain",
    "packages/protocol",
    "packages/server",
]
resolver = "3"

[workspace.package]
authors    = ["Braden Steffaniak"]
edition    = "2024"
license    = "MPL-2.0"
readme     = "README.md"
repository = "https://github.com/BSteffaniak/pool-with-friends"
version    = "0.1.0"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "2d",
    "ui",
    "web",
    "webgl2",
] }
futures-lite = { version = "2.6.1", default-features = false, features = [
    "std",
] }
switchy_database = { version = "0.4.0", default-features = false, features = [
    "schema",
    "simulator",
] }
switchy_database_connection = { version = "0.4.0", default-features = false, features = [
    "turso",
] }
switchy_schema = { version = "0.4.0", default-features = false, features = [
    "code",
] }
thiserror = { version = "2.0.20", default-features = false }
web-sys = { version = "0.3.104", default-features = false, features = [
    "Location",
    "Window",
] }

[profile.release]
codegen-units = 1
lto           = false
opt-level     = 3
strip         = "symbols"

[profile.release-lto]
inherits = "release"
lto      = "fat"

[profile.release-lto-no-panic]
inherits = "release-lto"
panic    = "abort"

[profile.small]
inherits  = "release-lto-no-panic"
opt-level = "z"
