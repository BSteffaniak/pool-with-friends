<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
    <meta name="theme-color" content="#08130f" />
    <title>Pool with More Than Friends</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="game-shell" aria-label="Pool with More Than Friends" data-client-state="loading">
      <canvas id="pwmtf-canvas" tabindex="0"></canvas>
      <section id="rotate-device" role="status" aria-live="polite">
        <strong>Rotate your device</strong>
        <span>Pool with More Than Friends plays in landscape.</span>
      </section>
      <section id="loading" role="status" aria-live="polite">Loading the table…</section>
      <section id="load-error" role="alert" hidden>
        <strong>The table could not load</strong>
        <span>Reload this page. If the problem continues, update your browser or enable WebGL 2.</span>
        <button type="button">Reload</button>
      </section>
      <aside id="feasibility-tools" hidden>
        <strong>Feasibility capture</strong>
        <output id="feasibility-metrics">Waiting for the client…</output>
        <div>
          <button id="capture-toggle" type="button">Start capture</button>
          <button id="audio-probe" type="button">Play audio probe</button>
          <button id="audio-mute" type="button" disabled>Mute</button>
          <button id="download-report" type="button">Download report</button>
        </div>
      </aside>
    </main>
    <script type="module" src="./bootstrap.js"></script>
  </body>
</html>
