app = "pwmtf"
primary_region = "ord"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PWMTF_BIND = "0.0.0.0:8080"
  PWMTF_CANONICAL_ORIGIN = "https://pwmtf.hyperchad.dev"
  PWMTF_DATABASE_PATH = "/data/pwmtf.db"
  PWMTF_GOOGLE_CALLBACK = "https://pwmtf.hyperchad.dev/auth/google/callback"
  PWMTF_GOOGLE_ISSUER = "https://accounts.google.com"
  PWMTF_WEB_ROOT = "/app/dist"

[[mounts]]
  source = "pwmtf_data"
  destination = "/data"

  initial_size = "1gb"

  [mounts.auto_extend_size]
  threshold_percent = 80
  increment = "1gb"
  limit = "10gb"

  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    path = "/readyz"
    timeout = "5s"
